[package]
name = "codex-readcov"
version = "0.1.10"
edition = "2024"
description = "Count file read actions in Codex rollout transcripts"
license = "MIT"
repository = "https://github.com/ustas-eth/ferrumctl"
readme = "README.md"

[[bin]]
name = "codex-readcov"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codex-shell-command = { git = "https://github.com/openai/codex.git", tag = "rust-v0.148.0" }
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
