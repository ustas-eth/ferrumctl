[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-wakectl"
version = "0.3.10"
description = "Schedule conditional input and synchronously poll Codex conditions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "codex-threadctl>=0.1,<0.6",
]

[tool.uv.sources]
codex-threadctl = { path = "../codex-threadctl" }

[project.urls]
Repository = "https://github.com/ustas-eth/ferrumctl"

[project.scripts]
codex-wakectl = "codex_wakectl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_wakectl"]
