[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-streamctl"
version = "0.1.4"
description = "Share durable append-only streams between coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/ustas-eth/ferrumctl"

[project.scripts]
codex-streamctl = "codex_streamctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_streamctl"]
