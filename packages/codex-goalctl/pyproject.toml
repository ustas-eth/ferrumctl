[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-goalctl"
version = "0.1.8"
description = "Small Unix-style CLI for Codex thread goals"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/ustas-eth/ferrumctl"

[project.scripts]
codex-goalctl = "codex_goalctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
