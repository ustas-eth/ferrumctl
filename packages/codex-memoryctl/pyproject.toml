[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-memoryctl"
version = "0.5.3"
description = "Locate, describe, compare, export, and inject Codex compaction memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "codex-threadctl>=0.7,<0.8",
  "websockets>=15,<16",
]

[tool.uv.sources]
codex-threadctl = { path = "../codex-threadctl" }

[project.urls]
Repository = "https://github.com/ustas-eth/ferrumctl"

[project.scripts]
codex-memoryctl = "codex_memoryctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_memoryctl"]
