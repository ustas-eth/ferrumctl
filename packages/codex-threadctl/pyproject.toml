[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-threadctl"
version = "0.5.3"
description = "Inspect and control app-server-backed Codex threads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "websockets>=15,<16",
]

[project.urls]
Repository = "https://github.com/ustas-eth/ferrumctl"

[project.scripts]
codex-threadctl = "codex_threadctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_threadctl"]
