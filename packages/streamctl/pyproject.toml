[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamctl"
version = "0.2.0"
description = "Share durable append-only streams between coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/ustas-eth/ferrumctl"

[project.scripts]
streamctl = "streamctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streamctl"]
